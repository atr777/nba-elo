# Second Bounce — Configuration

# API Endpoints
api:
  espn_scoreboard: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"
  request_timeout: 10
  retry_attempts: 3
  rate_limit_delay: 0.5  # seconds between requests

# ELO Parameters
elo:
  base_rating: 1500
  k_factor: 20
  # AUTHORITATIVE as of 2026-07-09: read by TeamELOEngine.deployed_config(), which
  # both the engine CLI and track_predictions_pregame use. Previously the CLI took
  # argparse defaults (home_advantage=100, concentration=True), so the team ratings
  # published on the site were built with a DIFFERENT config than the model predicts
  # with. Impact was small (sd 4.1 ELO, rank corr 0.999) because home advantage
  # mostly cancels over a balanced home/away schedule, but it was a live footgun.
  home_court_advantage: 60
  use_mov: true
  use_enhanced_features: true
  use_top_player_concentration: false   # cost accuracy on both validation seasons
  # 0.45, NOT the FiveThirtyEight 0.75. Swept 2026-07-09 after team-season
  # residuals came back NEGATIVELY autocorrelated (r=-0.106, p=0.0038): the rating
  # carried too much of last season forward. Expanding-window selection picked 0.45
  # in 12/13 windows; pooled OOS Brier 0.21696 -> 0.21576 (p=0.0000, 15,861 games).
  # Accuracy is unchanged (p=0.68). Read by team_elo_engine + track_predictions_pregame.
  # docs/research/2026-07-09-coaching-and-season-reversion.md
  season_reversion: 0.45

# Data Paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  exports: "data/exports"
  config: "config"
  figures: "figures"

# Season Configuration
season:
  current_season_start: "2025-10-01"
  current_season_end: "2026-06-30"
  
# Drift Detection
drift_detection:
  min_games_7d: 5          # skip accuracy drop check if fewer games in window
  min_games_30d: 10
  accuracy_drop_threshold: 0.05   # 5pp drop triggers alert
  consecutive_loss_threshold: 3   # 3 in a row triggers alert

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Roster-delta preseason ratings (approved by Aaron 2026-07-09).
# At a season boundary the engine nudges each team by k * (roster-talent change)
# in addition to the 75/25 mean reversion, so a team that lost its franchise
# player does not start the year pretending it still has him.
#
# start_season guards this to the 2026-27 boundary and later, which leaves the
# historical replay (and every rating we have already published) untouched.
#
# k=0.8 was selected out-of-sample by expanding-window validation; it won 12 of
# 13 held-out seasons. Pooled OOS Brier 0.21643 -> 0.21574 (p=0.0040). It does
# NOT improve accuracy (p=0.37) and must never be sold as an accuracy gain.
# Evidence: docs/research/2026-07-09-roster-delta.md
roster_delta:
  # DISABLED 2026-07-09 (Aaron). Once season_reversion was corrected to 0.45,
  # roster-delta added only +0.000297 Brier, p=0.272 (not significant): it was
  # mostly a proxy for "revert more". generate_preseason_ratings.py still uses it
  # to publish a roster-adjusted 2026-27 table, but the ENGINE does not consume it.
  enabled: false
  k: 0.8
  start_season: 2026              # NBA season 2026-27
  deltas_file: "data/exports/roster_deltas.csv"
