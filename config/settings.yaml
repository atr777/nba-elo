# Second Bounce — Configuration

# API Endpoints
api:
  espn_scoreboard: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"
  request_timeout: 10
  retry_attempts: 3
  rate_limit_delay: 0.5  # seconds between requests

# ELO Parameters
elo:
  base_rating: 1500
  k_factor: 20
  # NOTE: This config value is not yet read by engines (they use hardcoded defaults).
  # Actual values in production code:
  #   hybrid_team_player.py: 60 (the main prediction path — what actually runs)
  #   hybrid_predictor.py:   30
  #   team_elo_engine.py:    20
  # Sprint backlog: consolidate all to 60 (calibrated to 54.3% home win rate).
  home_court_advantage: 60
  season_reversion: 0.75   # FiveThirtyEight: 75% prior + 25% mean (1500)

# Data Paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  exports: "data/exports"
  config: "config"
  figures: "figures"

# Season Configuration
season:
  current_season_start: "2025-10-01"
  current_season_end: "2026-06-30"
  
# Drift Detection
drift_detection:
  min_games_7d: 5          # skip accuracy drop check if fewer games in window
  min_games_30d: 10
  accuracy_drop_threshold: 0.05   # 5pp drop triggers alert
  consecutive_loss_threshold: 3   # 3 in a row triggers alert

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Roster-delta preseason ratings (approved by Aaron 2026-07-09).
# At a season boundary the engine nudges each team by k * (roster-talent change)
# in addition to the 75/25 mean reversion, so a team that lost its franchise
# player does not start the year pretending it still has him.
#
# start_season guards this to the 2026-27 boundary and later, which leaves the
# historical replay (and every rating we have already published) untouched.
#
# k=0.8 was selected out-of-sample by expanding-window validation; it won 12 of
# 13 held-out seasons. Pooled OOS Brier 0.21643 -> 0.21574 (p=0.0040). It does
# NOT improve accuracy (p=0.37) and must never be sold as an accuracy gain.
# Evidence: docs/research/2026-07-09-roster-delta.md
roster_delta:
  enabled: true
  k: 0.8
  start_season: 2026              # NBA season 2026-27
  deltas_file: "data/exports/roster_deltas.csv"
