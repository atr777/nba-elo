# Substack Notes queue. The machine drips from here; Aaron approves.
#
# THIS FILE IS THE PLAN, NOT THE RECORD. The drip never writes to it, so it is
# safe to edit from anywhere (including GitHub on your phone) while the VPS pulls.
# What has already been sent is tracked separately in data/exports/notes_posted.json
# on the VPS, which is also what stops a note going out twice.
#
# status:  hold      -> will NEVER post (default for everything new)
#          approved  -> eligible for the next drip slot, top of the file first
#
# TO APPROVE: change that note's `status: hold` to `status: approved`. That is the
# only edit needed. Nothing posts without BOTH `approved` here AND --live on the
# command (the VPS cron passes --live).
#
# APPROVING DOES NOT PRIORITISE. The drip takes the first approved-and-unsent note in
# FILE ORDER, and it sends at most 2 a day with 5 hours between them. So a note
# approved today can be three days out if two other approved notes sit above it.
# Bit us on 2026-07-30: the launch note for a fresh post was approved promptly, sat
# third, and would have gone stale waiting its turn.
#   TO SEND SOMETHING NEXT, MOVE ITS BLOCK UP. Position is the only priority signal.
#   To check what is actually next: python scripts/drip_notes.py --status
#
# IMAGES: add an optional `image:` path to attach a graphic. Feed images should be
# 4:5 portrait (1080x1350); the drip warns on landscape. Build them with
# `python scripts/generate_receipt_note.py season|calibration`.
#
# LINKS: add an optional `link:` URL to attach a preview card, which is how a note
# sends readers to one of our posts. For a Second Bounce URL Substack renders the
# post card (title + cover), not a plain link box. A note takes an IMAGE OR A LINK,
# not both; the drip rejects a note carrying both rather than guessing.
#
# USE THEM SPARINGLY (Aaron, 2026-07-26): if every note carries a graphic the feed
# looks automated. The receipt is for notes making a claim that wants proof; the
# observational and human notes stay text-only. Roughly 1 in 3 is the target.
#
# Rules enforced automatically before anything is sent: no em dashes, no unfilled
# [placeholders], no mention of 73.5%, non-empty, under 2800 chars. A note that
# fails is recorded as rejected and never retried silently.
#
# Seeded 2026-07-26 from docs/growth/banks/2026-W27-bank.md. Notes 1 and 7 of that
# bank were reworded here to drop the retracted 73.5% figure.

