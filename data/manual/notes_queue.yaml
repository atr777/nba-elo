# Substack Notes queue. The machine drips from here; Aaron approves.
#
# THIS FILE IS THE PLAN, NOT THE RECORD. The drip never writes to it, so it is
# safe to edit from anywhere (including GitHub on your phone) while the VPS pulls.
# What has already been sent is tracked separately in data/exports/notes_posted.json
# on the VPS, which is also what stops a note going out twice.
#
# status:  hold      -> will NEVER post (default for everything new)
#          approved  -> eligible for the next drip slot, top of the file first
#
# TO APPROVE: change that note's `status: hold` to `status: approved`. That is the
# only edit needed. Nothing posts without BOTH `approved` here AND --live on the
# command (the VPS cron passes --live).
#
# Rules enforced automatically before anything is sent: no em dashes, no unfilled
# [placeholders], no mention of 73.5%, non-empty, under 2800 chars. A note that
# fails is recorded as rejected and never retried silently.
#
# Seeded 2026-07-26 from docs/growth/banks/2026-W27-bank.md. Notes 1 and 7 of that
# bank were reworded here to drop the retracted 73.5% figure.

