# add is the model's read on whether the bargain changes the forecast. Do not
# restate his production-vs-pay analysis, we have no salary data to check it with.
#
# Contract verified 2026-07-27 (ESPN, CBS, Yahoo): 2 years / $8M, veteran minimum,
# $3,876,529 in 2026-27 with a $4,070,355 player option for 2027-28, down from
# nearly $53M with the Lakers. Ratings are from the post-rebuild file: LeBron is
# 1,844 and 13th among the 541 players active in 2026, NOT the 1,947 still sitting
# in the July 8 and July 9 packs.

- id: w31-16
  status: hold
  text: |
    LeBron James will earn about 3.9 million dollars in Philadelphia next season,
    down from nearly 53 million. Our ratings have him 13th among active NBA
    players. What we can add to the discount story: it does not make Philadelphia a
    favorite. Our preseason table moves them from 1486 to 1530, which is 12th. A
    minimum contract for a top 15 player is a bargain, not a coronation.

- id: w31-17
  status: hold
  text: |
    Philadelphia added the 13th rated active player in our system for close to the
    minimum. Miami added the 3rd. Washington added the 10th. Our preseason table
    still has all three of them outside the top ten, because a roster is more than
    its best addition, and last season does not stop counting because the summer
    was loud.
